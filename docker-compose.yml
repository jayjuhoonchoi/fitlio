services:
  nginx:
    image: nginx:latest
    environment:
      FITLIO_DOMAIN: fitlio-jay.duckdns.org
      FITLIO_PORT_IN_REDIRECT: ""
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.http.conf:/etc/nginx/templates/default.http.conf:ro
      - ./nginx/default.https.conf:/etc/nginx/templates/default.https.conf:ro
      - ./nginx/entrypoint/40-fitlio-ssl-auto.sh:/docker-entrypoint.d/40-fitlio-ssl-auto.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://fitlio:fitlio123@db:5432/fitlio
      SECRET_KEY: ${SECRET_KEY:-fitlio-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 25s

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fitlio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitlio123}
      POSTGRES_DB: fitlio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlio -d fitlio"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "jayjuhoonchoi@gmail.com"
      GF_SMTP_PASSWORD: "pymt rrqa izbb nsav"
      GF_SMTP_FROM_ADDRESS: "jayjuhoonchoi@gmail.com"
      GF_SMTP_FROM_NAME: "Fitlio Grafana"
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped

volumes:
  postgres_data: