# FITLIO_NGINX_HTTPS_ENABLED
server {
    listen 80;
    server_name ${FITLIO_DOMAIN} _;

    # Keep ACME reachable on port 80 for certbot renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host${FITLIO_PORT_IN_REDIRECT}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${FITLIO_DOMAIN} _;

    ssl_certificate /etc/letsencrypt/live/${FITLIO_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${FITLIO_DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Next.js (server-side rewrites proxy JSON to api:8000)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Fitlio-Proxy "web" always;
    }
}
