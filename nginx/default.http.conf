# FITLIO_NGINX_HTTP_ONLY_FALLBACK
server {
    listen 80;
    server_name ${FITLIO_DOMAIN} _;

    # Keep ACME reachable on port 80 for certbot webroot validation.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://${FITLIO_DOMAIN}:8443$request_uri;
    }
}