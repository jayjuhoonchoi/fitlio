apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fitlio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: jayjuhoonchoi/fitlio-web:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: FITLIO_API_PROXY_TARGET
          value: http://api:8000
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 25
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "192Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fitlio
spec:
  selector:
    app: web
  ports:
  - port: 3000
    targetPort: 3000
